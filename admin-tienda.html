<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f2f2f3">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='240 254 581 508'%3E%3Cpolygon points='246,260 426,548 606,260 607,756 570,756 570,388 426,617 283,388 283,756 246,756'/%3E%3Crect x='606' y='323' width='209' height='37'/%3E%3Crect x='606' y='521' width='161' height='37'/%3E%3C/svg%3E">
<title>Centro de control · MF Colombia</title>
<script>/* Si ya hay sesión guardada, se muestra una rueda mientras se verifica: así nunca aparece la pantalla de clave por un instante. */
try { if (sessionStorage.getItem('mf_admin_token')) document.documentElement.classList.add('verificando'); } catch (e) {}</script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="panel.css">
<link rel="stylesheet" href="banners.css">
<link rel="stylesheet" href="admin-banners.css">
<link rel="stylesheet" href="admin-ventas.css">
</head>
<body>
<p id="msg" role="status"></p>

<div class="cargando-app" id="cargando" role="status" aria-label="Verificando sesión"><div class="rueda"></div></div>

<div class="entrada" id="entrada">
  <form class="caja" id="form-entrada" autocomplete="on">
    <span class="logo"><svg viewBox="240 254 581 508" fill="currentColor" role="img" aria-label="Marlon Footwear"><polygon points="246,260 426,548 606,260 607,756 570,756 570,388 426,617 283,388 283,756 246,756"/><rect x="606" y="323" width="209" height="37"/><rect x="606" y="521" width="161" height="37"/></svg></span>
    <h1>Centro de control</h1>
    <input id="token" type="password" placeholder="Clave del panel" autocomplete="current-password" aria-label="Clave del panel" required>
    <button id="entrar" type="submit">Entrar</button>
    <p class="aviso" id="aviso" role="alert"></p>
  </form>
</div>

<div class="shell" id="app" hidden>
  <header class="top">
    <button type="button" class="ib menu" id="abrir-menu" aria-label="Abrir menú" aria-expanded="false" aria-controls="lado"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <span class="ttl" id="ttl"></span>
    <a class="ver" href="/" target="_blank" rel="noopener">Ver tienda</a>
  </header>
  <div class="velo" id="velo"></div>
  <aside class="lado" id="lado" aria-label="Menú del panel">
    <div class="cab"><a class="logo" href="#/" aria-label="Inicio del panel"><svg viewBox="240 254 581 508" fill="currentColor" role="img" aria-label="Marlon Footwear"><polygon points="246,260 426,548 606,260 607,756 570,756 570,388 426,617 283,388 283,756 246,756"/><rect x="606" y="323" width="209" height="37"/><rect x="606" y="521" width="161" height="37"/></svg></a><button type="button" class="ib" id="cerrar-menu" aria-label="Cerrar menú"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="buscar"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="buscar" type="search" placeholder="Buscar" aria-label="Buscar en el panel" autocomplete="off"></div>
    <nav id="menu" aria-label="Secciones del panel"></nav>
    <div class="cfg" id="cfg" hidden></div>
    <div class="pie"><button type="button" class="it" id="cfg-btn" aria-expanded="false" aria-controls="cfg"></button><button type="button" class="ib" id="cerrar-menu2" aria-label="Cerrar menú"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  </aside>
  <main id="principal">
    <nav class="ruta" id="ruta" aria-label="Ruta"></nav>
    <div class="cab-sec"><h1 id="h1"></h1></div>
    <details class="ayuda" id="ayuda" hidden></details>
    <section class="panel" id="p-resumen"><div id="resumen" class="resumen" aria-live="polite"></div></section>
    <section class="panel" id="p-pedidos"></section>
    <section class="panel" id="p-whatsapp"></section>
    <section class="panel" id="p-finanzas"></section>
    <section class="panel" id="p-productos"></section>
    <section class="panel" id="p-inventario"></section>
    <section class="panel" id="p-colecciones"></section>
    <section class="panel" id="p-descuentos"></section>
    <section class="panel" id="p-inicio"></section>
    <section class="panel" id="p-vitrina"></section>
    <section class="panel" id="p-vestidos"></section>
    <section class="panel" id="p-comunidad"></section>
    <section class="panel" id="p-contenido"></section>
    <section class="panel" id="p-envio"></section>
    <section class="panel" id="p-registro"></section>
    <section class="panel" id="p-facturas"></section>
    <section class="panel" id="p-papelera"></section>
  </main>
</div>

<script src="banners.js"></script>
<script src="sugerir-color.js"></script>
<script src="DATA/recortes.js"></script>
<script src="admin-tienda.js"></script>
<script src="admin-banners.js"></script>
<script src="admin-descuentos.js"></script>
<script src="admin-comunidad.js"></script>
<script src="admin-vitrina.js"></script>
<script src="admin-paleta.js"></script>
<script src="admin-ventas.js"></script>
<script src="admin-resumen.js"></script>
<script src="admin-facturas.js"></script>
<script src="admin-papelera.js"></script>
<script src="admin-vestidos.js"></script>
<script src="panel-menu.js"></script>
</body>
</html>
