<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0b0c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='240 254 581 508'%3E%3Cpolygon points='246,260 426,548 606,260 607,756 570,756 570,388 426,617 283,388 283,756 246,756'/%3E%3Crect x='606' y='323' width='209' height='37'/%3E%3Crect x='606' y='521' width='161' height='37'/%3E%3C/svg%3E">
<title>Centro de control · MF Colombia</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Mismo diseño que la tienda: blanco y negro, verde #1d5c45, Cormorant Garamond + Figtree, botones en píldora */
  :root { --k:#000; --w:#fff; --g1:#f6f6f4; --g2:#e4e4e0; --g3:#6b6b66; --gr:#1d5c45; --gs:#e6f0ea; --bad:#a3342f; --warn:#7a5200; --warn-bg:#faefd6; --ease:cubic-bezier(.2,.8,.2,1); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--w); color:var(--k); font:400 16px/1.6 Figtree,system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  h1, h2, h3 { font-family:'Cormorant Garamond',Georgia,serif; font-weight:700; margin:0; line-height:1.05; letter-spacing:-.01em; }
  p { margin:0; } a { color:inherit; }
  :focus-visible { outline:3px solid var(--k); outline-offset:3px; }
  .bar-off { position:sticky; top:0; z-index:40; background:#ffffffeb; backdrop-filter:blur(14px); border-bottom:1px solid var(--g2); display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding:.65rem 1.2rem; padding-top:calc(.65rem + env(safe-area-inset-top,0px)); }
  .bar a.lk { justify-self:start; font-weight:600; text-decoration:underline; text-underline-offset:6px; text-decoration-color:var(--g2); }
  .bar a.lk:hover { text-decoration-color:var(--k); }
  .bar .logo { height:2.1rem; color:var(--k); } .bar .logo svg { height:2.1rem; display:block; }
  .btn, .boton { display:inline-flex; justify-content:center; align-items:center; gap:.55rem; min-height:3rem; margin-top:1rem; padding:.9rem 1.8rem; border-radius:999px; border:1.5px solid var(--k); background:var(--k); color:var(--w); font:inherit; font-weight:600; cursor:pointer; text-decoration:none; transition:background .2s,color .2s,transform .2s; }
  .btn:hover, .boton:hover { background:var(--w); color:var(--k); transform:translateY(-1px); } .btn:active, .boton:active { transform:scale(.97); }
  .boton.claro, .btn.o { background:var(--w); color:var(--k); } .boton.claro:hover, .btn.o:hover { background:var(--k); color:var(--w); }
  .btn:disabled, .boton:disabled { opacity:.35; cursor:default; transform:none; }
  input, select { font:inherit; color:inherit; }
  @media (prefers-reduced-motion: reduce) { *, *::after { transition:none !important; animation:none !important; } }
  [hidden] { display:none !important; }
  header { display:flex; flex-wrap:wrap; gap:.8rem; align-items:center; justify-content:space-between; padding:.8rem 1.2rem; border-bottom:1px solid var(--g2); background:var(--w); }
  header .logo { height:2rem; color:var(--k); } header .logo svg { height:2rem; display:block; }
  h1 { font-size:1.9rem; }
  main { max-width:980px; margin:0 auto; padding:1.4rem 1.2rem 4rem; }
  input, select { padding:.6rem .95rem; border:1.5px solid var(--g2); border-radius:999px; background:var(--w); outline:none; max-width:100%; }
  input:focus, select:focus { border-color:var(--k); }
  button { font:inherit; padding:.55rem 1.3rem; min-height:0; border-radius:999px; border:1.5px solid var(--k); background:var(--k); color:var(--w); font-weight:600; cursor:pointer; transition:background .2s,color .2s; }
  button:hover:not(:disabled) { background:var(--w); color:var(--k); } button.claro { background:var(--w); color:var(--k); } button.claro:hover:not(:disabled) { background:var(--k); color:var(--w); }
  button:disabled, input:disabled, select:disabled { opacity:.4; cursor:default; }
  .barra { display:flex; flex-wrap:wrap; gap:.6rem; align-items:center; }
  .barra label { display:flex; gap:.5rem; align-items:center; font-weight:500; font-size:.9rem; }
  .pedido { border:1px solid var(--g2); border-radius:1.6rem; padding:1.2rem; margin:1rem 0; background:var(--w); }
  .fila { display:flex; flex-wrap:wrap; gap:.4rem 1.2rem; justify-content:space-between; align-items:center; }
  .ref { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.82rem; overflow-wrap:anywhere; }
  .suave { color:var(--g3); font-size:.9rem; } .pedido p { margin:.5rem 0; }
  .etiqueta { display:inline-block; padding:.1rem .7rem; border-radius:999px; font-size:.78rem; font-weight:600; border:1.5px solid currentColor; }
  .APPROVED { color:var(--gr); } .PENDING { color:var(--warn); } .DECLINED, .ERROR, .VOIDED { color:var(--bad); }
  .alerta { background:var(--warn-bg); color:var(--warn); border-radius:1rem; padding:.55rem .9rem; margin:.7rem 0; font-size:.9rem; }
  .envio { display:flex; flex-wrap:wrap; gap:.5rem; margin-top:.8rem; align-items:center; }
  #msg { margin:.8rem 0; min-height:1.5em; } #msg.mal { color:var(--bad); } #msg.ok { color:var(--gr); font-weight:500; }

  nav.tabs { display:flex; flex-wrap:wrap; gap:.4rem; margin:0 0 1.2rem; }
  nav.tabs button { background:var(--w); color:var(--k); } nav.tabs button.on { background:var(--k); color:var(--w); }
  .panel { display:none; } .panel.on { display:block; }
  table { width:100%; border-collapse:collapse; font-size:.92rem; } th, td { text-align:left; padding:.5rem .4rem; border-bottom:1px solid var(--g2); vertical-align:middle; }
  .form { display:grid; gap:.8rem; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); border:1px solid var(--g2); border-radius:1.6rem; padding:1.2rem; margin:1rem 0; }
  .form label { display:grid; gap:.25rem; font-weight:500; font-size:.9rem; } .form .ancho { grid-column:1/-1; }
  .form input, .form select, .form textarea { border-radius:1rem; width:100%; padding:.6rem .95rem; border:1.5px solid var(--g2); font:inherit; } .form textarea { min-height:5rem; }
  .form label.ck { display:flex; align-items:center; gap:.5rem; } .form label.ck input { width:auto; }
  .fotos { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:.6rem; margin:.5rem 0 .8rem; }
  .foto { display:grid; gap:.3rem; align-content:start; } .foto img { width:100%; aspect-ratio:4/5; object-fit:cover; border-radius:.6rem; background:#eee; }
  .foto button { padding:.35rem .5rem; font-size:.78rem; } .foto .prin { font-size:.78rem; font-weight:700; text-align:center; }
  .tallas { display:grid; grid-template-columns:repeat(auto-fit,minmax(64px,1fr)); gap:.4rem; }
  .nota { color:var(--g3); font-size:.85rem; }
  .linea { display:flex; justify-content:space-between; gap:1rem; } .tot { font-weight:700; }

  /* ===== Panel grande y claro: blanco y negro, botones grandes para el dedo ===== */
  :root { --k:#0b0b0c; --g1:#f2f2f3; --g2:#dcdcde; --g3:#66666b; --gr:#1d5c45; }
  html { -webkit-text-size-adjust:100%; } body { background:var(--g1); overflow-x:hidden; font-size:17px; }
  header { position:sticky; top:0; z-index:30; background:#fffffff2; backdrop-filter:blur(12px); padding:.7rem 1rem; padding-top:calc(.7rem + env(safe-area-inset-top,0px)); }
  h1 { color:var(--k); font-size:1.7rem; }
  main { max-width:760px; padding:1rem 1rem 3rem; }
  input, select, textarea { font-size:16px; } /* evita el zoom automático del iPhone */
  input, select { min-height:3rem; padding:.7rem 1.1rem; }
  button, .btn, .boton { min-height:3rem; padding:.7rem 1.5rem; font-size:1rem; background:var(--k); border-color:var(--k); color:#fff; }
  button:hover:not(:disabled) { background:#fff; color:var(--k); }
  button.claro, .btn.o, .boton.claro { background:#fff; border-color:var(--g2); color:var(--k); }
  button.claro:hover:not(:disabled) { background:var(--g1); }
  input:focus, select:focus, textarea:focus { border-color:var(--k); } :focus-visible { outline-color:var(--k); }
  .pedido, .form, .pcard, .icard { background:#fff; border:0; border-radius:1.2rem; box-shadow:0 1px 0 var(--g2); }

  /* Inicio: botones grandes */
  nav.tabs { display:grid; grid-template-columns:1fr 1fr; gap:.8rem; margin:.4rem 0 1rem; position:static; padding:0; background:none; border:0; overflow:visible; }
  nav.tabs button { display:flex; flex-direction:column; align-items:flex-start; justify-content:flex-end; gap:.15rem; min-height:8.2rem; padding:1rem; border-radius:1.4rem; border:0; background:#fff; color:var(--k); text-align:left; box-shadow:0 1px 0 var(--g2); font-size:1.25rem; font-weight:700; white-space:normal; }
  nav.tabs button small { font-size:.85rem; font-weight:400; color:var(--g3); line-height:1.3; }
  nav.tabs button:hover:not(:disabled), nav.tabs button:active { background:var(--k); color:#fff; } nav.tabs button:hover small, nav.tabs button:active small { color:#d0d0d4; }
  nav.tabs button .ic { font-size:1.9rem; line-height:1; margin-bottom:auto; }
  .volver { display:flex; align-items:center; gap:.8rem; margin:.2rem 0 1rem; }
  .volver button { flex:none; } .volver h2 { font-size:1.9rem; }

  /* Productos e inventario en tarjetas */
  .pcard { display:grid; grid-template-columns:5.2rem 1fr; gap:.2rem .9rem; padding:.8rem; margin:.7rem 0; align-items:center; }
  .pcard img, .pcard .sinfoto { width:5.2rem; height:6.5rem; object-fit:cover; border-radius:.8rem; background:var(--g1); grid-row:1/3; }
  .pcard .sinfoto { display:grid; place-items:center; color:var(--g3); font-size:.75rem; text-align:center; }
  .pcard b { font-size:1.05rem; line-height:1.25; } .pcard .meta { color:var(--g3); font-size:.92rem; }
  .pcard .acc { grid-column:2; display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; }
  .pcard .acc button { min-height:2.6rem; padding:.45rem 1.2rem; }
  .est-ok { color:var(--gr); font-weight:600; } .est-no { color:var(--bad); font-weight:600; }
  .icard { padding:1rem; margin:.7rem 0; } .icard h3 { font-size:1.35rem; margin-bottom:.6rem; }
  .icard .tallas { grid-template-columns:repeat(auto-fill,minmax(72px,1fr)); gap:.5rem; margin:.6rem 0; }
  .icard .tallas label { display:grid; gap:.2rem; text-align:center; font-size:.85rem; font-weight:600; } .icard .tallas input { text-align:center; padding:.5rem .2rem; border-radius:.9rem; width:100%; }
  .acc2 { display:flex; flex-wrap:wrap; gap:.5rem; margin-top:.7rem; } .acc2 button { min-height:2.7rem; padding:.5rem 1.1rem; }
  .form label.sel { padding:.55rem 0; font-size:1rem; border-bottom:1px solid var(--g1); } .form label.ck input { width:1.4rem; height:1.4rem; min-height:0; }
  .agot { background:#fbe9e7; }
  .form { grid-template-columns:1fr; } .form input, .form select, .form textarea { border-radius:1rem; }
  .fotos { grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); }
  .foto button { min-height:2.4rem; font-size:.85rem; padding:.3rem .5rem; }
  table { font-size:.85rem; display:block; overflow-x:auto; }
  #msg:empty { display:none; } #msg { margin:.4rem 0; }
  @media (min-width:700px) { nav.tabs { grid-template-columns:repeat(3,1fr); } }
</style>
</head>
<body>
<header>
  <div class="barra"><span class="logo"><svg viewBox="240 254 581 508" fill="currentColor" role="img" aria-label="Marlon Footwear"><polygon points="246,260 426,548 606,260 607,756 570,756 570,388 426,617 283,388 283,756 246,756"/><rect x="606" y="323" width="209" height="37"/><rect x="606" y="521" width="161" height="37"/></svg></span><h1>Centro de control</h1></div>
  <div class="barra">
    <input id="token" type="password" placeholder="Clave del panel" autocomplete="current-password" aria-label="Clave del panel">
    <button id="entrar" type="button">Entrar</button>
    <button id="salir" type="button" class="claro" hidden>Salir</button>
  </div>
</header>
<main>
  <p id="msg" role="status"></p>
  <div id="app" hidden>
    <nav class="tabs" id="tabs">
      <button type="button" data-t="productos"><span class="ic">👟</span>Productos<small>Crear, editar y subir fotos</small></button>
      <button type="button" data-t="colecciones"><span class="ic">🗂️</span>Colecciones<small>Agrupa tus productos</small></button>
      <button type="button" data-t="inventario"><span class="ic">📦</span>Inventario<small>Cuántos pares hay por talla</small></button>
      <button type="button" data-t="pedidos"><span class="ic">🧾</span>Pedidos<small>Pagos, guías y envíos</small></button>
      <button type="button" data-t="envio"><span class="ic">🚚</span>Envío<small>Tarifa de envío</small></button>
      <button type="button" data-t="contenido"><span class="ic">✏️</span>Contenido<small>Textos y colecciones</small></button>
      <button type="button" data-t="registro"><span class="ic">🕘</span>Registro<small>Qué ha pasado en la tienda</small></button>
    </nav>
    <div class="volver" id="volver" hidden><button type="button" id="inicio" class="claro">← Inicio</button><h2 id="titulo"></h2></div>
    <section class="panel" id="p-productos"></section>
    <section class="panel" id="p-colecciones"></section>
    <section class="panel" id="p-inventario"></section>
    <section class="panel" id="p-envio"></section>
    <section class="panel" id="p-contenido"></section>
    <section class="panel" id="p-pedidos"></section>
    <section class="panel" id="p-registro"></section>
  </div>
</main>
<script src="admin-tienda.js"></script>
</body>
</html>
