<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='240 254 581 508'%3E%3Cpolygon points='246,260 426,548 606,260 607,756 570,756 570,388 426,617 283,388 283,756 246,756'/%3E%3Crect x='606' y='323' width='209' height='37'/%3E%3Crect x='606' y='521' width='161' height='37'/%3E%3C/svg%3E">
<title>Tu pedido · MF Colombia</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  /* Mismo lenguaje visual que los flujos de la tienda: blanco y negro, Cormorant Garamond + Jost, esquinas rectas */
  :root { --k:#000; --w:#fff; --g1:#f6f6f4; --g2:#e4e4e0; --g3:#6b6b66; --gr:#1d5c45; --gs:#e6f0ea; --bad:#a3342f; --warn:#7a5200; --warn-bg:#faefd6; --ease:cubic-bezier(.2,.8,.2,1); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--w); color:var(--k); font:300 15px/1.7 Jost,system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  h1, h2, h3 { font-family:'Cormorant Garamond',Georgia,serif; font-weight:500; margin:0; line-height:1.05; letter-spacing:-.01em; }
  p { margin:0; } a { color:inherit; }
  :focus-visible { outline:3px solid var(--k); outline-offset:3px; }
  .bar { position:sticky; top:0; z-index:40; background:#ffffffeb; backdrop-filter:blur(14px); border-bottom:1px solid var(--g2); display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding:.65rem 1.2rem; padding-top:calc(.65rem + env(safe-area-inset-top,0px)); }
  .bar a.lk { justify-self:start; font-weight:600; text-decoration:underline; text-underline-offset:6px; text-decoration-color:var(--g2); }
  .bar a.lk:hover { text-decoration-color:var(--k); }
  .bar .logo { height:2.1rem; color:var(--k); } .bar .logo svg { height:2.1rem; display:block; }
  .btn, .boton { display:inline-flex; justify-content:center; align-items:center; gap:.55rem; min-height:3.6rem; margin-top:1rem; padding:.9rem 2rem; border-radius:0; border:1px solid var(--k); background:var(--k); color:var(--w); font:400 .74rem Jost,sans-serif; letter-spacing:.3em; text-transform:uppercase; cursor:pointer; text-decoration:none; transition:background .2s,color .2s,transform .2s; }
  .btn:hover, .boton:hover { background:var(--w); color:var(--k); } .btn:active, .boton:active { transform:scale(.97); }
  .boton.claro, .btn.o { background:var(--w); color:var(--k); } .boton.claro:hover, .btn.o:hover { background:var(--k); color:var(--w); }
  .btn:disabled, .boton:disabled { opacity:.35; cursor:default; transform:none; }
  input, select { font:inherit; color:inherit; }

  /* ---- Línea de seguimiento ---- */
  .seg { margin:1.2rem 0 .4rem; text-align:left; }
  .linea { list-style:none; margin:0; padding:0; position:relative; }
  .et { position:relative; display:grid; grid-template-columns:3.4rem 1fr; gap:1rem; align-items:start; padding:0 0 1.9rem; }
  .et:last-child { padding-bottom:0; }
  .et::before { content:""; position:absolute; left:1.7rem; top:3.4rem; bottom:0; width:1px; background:var(--g2); transform:translateX(-.5px); }
  .et:last-child::before { display:none; }
  .et.hecho::before { background:var(--k); }
  .dot { width:3.4rem; height:3.4rem; border:1px solid var(--g2); border-radius:50%; display:grid; place-items:center; background:var(--w); color:var(--g2); position:relative; z-index:1; transition:background .5s,color .5s,border-color .5s; }
  .ico { width:1.6rem; height:1.6rem; fill:none; stroke:currentColor; stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round; }
  .tx { padding-top:.5rem; }
  .tx b { display:block; font:500 1.45rem/1.1 'Cormorant Garamond',Georgia,serif; color:var(--g3); }
  .tx small { display:block; margin-top:.3rem; font-size:.82rem; color:var(--g3); }
  .et.hecho .dot { background:var(--k); border-color:var(--k); color:var(--w); }
  .et.hecho .tx b, .et.actual .tx b { color:var(--k); }
  .et.actual .dot { border-color:var(--k); color:var(--k); box-shadow:0 0 0 0 rgba(0,0,0,.35); animation:pulso 2s infinite; }
  .et.actual:last-child .dot { background:var(--k); color:var(--w); animation:none; }
  @keyframes pulso { 0% { box-shadow:0 0 0 0 rgba(0,0,0,.3); } 100% { box-shadow:0 0 0 .9rem rgba(0,0,0,0); } }
  /* Entrada: cada paso se revela en orden; el que acaba de cambiar destaca más */
  .et.anima .dot { animation:aparece .7s cubic-bezier(.2,.9,.2,1.3) both; animation-delay:var(--d,0s); }
  .et.anima .tx { animation:sube .8s cubic-bezier(.2,.9,.2,1) both; animation-delay:calc(var(--d,0s) + .15s); }
  .et.anima.hecho::before { animation:baja .8s cubic-bezier(.77,0,.18,1) both; animation-delay:calc(var(--d,0s) + .3s); transform-origin:top; }
  .et.anima.hecho .ico path, .et.anima.hecho .ico circle { stroke-dasharray:60; stroke-dashoffset:60; animation:dibuja 1s ease-out forwards; animation-delay:calc(var(--d,0s) + .25s); }
  .et.anima.actual .dot { animation:aparece .7s cubic-bezier(.2,.9,.2,1.3) both, pulso 2s 1.5s infinite; animation-delay:var(--d,0s), calc(var(--d,0s) + .9s); }
  .et.nuevo .dot { animation:aparece .7s cubic-bezier(.2,.9,.2,1.3) both, destello 1.4s .6s ease-out 2, pulso 2s 3s infinite; animation-delay:var(--d,0s), calc(var(--d,0s) + .6s), calc(var(--d,0s) + 3s); }
  .et.nuevo .tx b { animation:resalta 1.6s .5s ease-out 1; }
  @keyframes aparece { from { transform:scale(.4); opacity:0; } to { transform:none; opacity:1; } }
  @keyframes sube { from { transform:translateY(.8rem); opacity:0; } to { transform:none; opacity:1; } }
  @keyframes baja { from { transform:scaleY(0); } to { transform:scaleY(1); } }
  @keyframes dibuja { to { stroke-dashoffset:0; } }
  @keyframes destello { 0% { box-shadow:0 0 0 0 rgba(0,0,0,.5); } 100% { box-shadow:0 0 0 1.6rem rgba(0,0,0,0); } }
  @keyframes resalta { 0%,100% { letter-spacing:0; } 40% { letter-spacing:.04em; } }
  /* Camión que recorre el trayecto cuando el pedido va en camino */
  .camion { position:absolute; left:1.7rem; top:3.4rem; bottom:.1rem; width:0; pointer-events:none; }
  .camion::after { content:""; position:absolute; left:-.35rem; width:.7rem; height:.7rem; border-radius:50%; background:var(--k); animation:viaja 3s ease-in-out infinite; }
  @keyframes viaja { from { top:0; } to { top:calc(100% - .7rem); } }
  .cf1 { position:fixed; top:-10px; width:7px; height:7px; background:var(--k); opacity:0; pointer-events:none; z-index:120; animation:cfl 2.6s ease-out forwards; }
  .cf1:nth-child(3n) { background:var(--g3); } .cf1:nth-child(3n+1) { background:#fff; border:1px solid var(--k); }
  @keyframes cfl { 10% { opacity:1; } 100% { opacity:0; transform:translate3d(var(--x),105vh,0) rotate(540deg); } }
  @media (prefers-reduced-motion: reduce) { *, *::after { transition:none !important; animation:none !important; } }
  @media (prefers-reduced-motion: reduce) { .et.anima.hecho .ico path, .et.anima.hecho .ico circle { stroke-dasharray:none; stroke-dashoffset:0; } .cf1 { display:none; } }
  main { max-width:680px; margin:0 auto; padding:2.2rem 1.2rem 4rem; }
  .tarjeta { text-align:center; }
  h1 { font-size:clamp(2.8rem,9vw,4.4rem); margin:0 0 1rem; }
  .estado-ok h1::before, .estado-mal h1::before { display:grid; place-items:center; width:5rem; height:5rem; border-radius:50%; background:none; border:1px solid var(--k); color:var(--k); font:300 1.9rem Jost,sans-serif; margin:0 auto 1.3rem; }
  .estado-ok h1::before { content:"✓"; } .estado-mal h1::before { content:"✕"; border-color:var(--bad); color:var(--bad); }
  .suave { color:var(--g3); } .tarjeta > p { margin:.4rem 0; }
  .ref { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.85rem; word-break:break-all; color:var(--k); }
  hr { border:0; border-top:1px solid var(--g2); margin:1.2rem 0; }
  ul { list-style:none; margin:1.2rem 0 0; padding:1rem 1.2rem .4rem; background:var(--w); border:1px solid var(--g2); border-bottom:0; border-radius:0; text-align:left; }
  li { display:flex; justify-content:space-between; gap:1rem; padding:.3rem 0; }
  .total { display:flex; justify-content:space-between; font-weight:600; font-size:1.2rem; padding:.8rem 1.2rem 1rem; background:var(--w); border:1px solid var(--g2); border-radius:0; text-align:left; }
  ul li { display:flex; justify-content:space-between; gap:1rem; padding:.5rem 0; border-bottom:1px solid var(--g2); }
  ul li:last-child { border-bottom:0; }
  ul li small { display:block; font-size:.82rem; }
  .sec { font-family:Jost,sans-serif; font-weight:400; font-size:.68rem; letter-spacing:.3em; text-transform:uppercase; color:var(--g3); margin:1.6rem 0 .2rem; text-align:left; font-weight:600; }
  .fila-r { display:flex; justify-content:space-between; gap:1rem; padding:.35rem 1.2rem; background:var(--w); border:1px solid var(--g2); border-top:0; border-bottom:0; text-align:left; }
  .datos { background:var(--w); border:1px solid var(--g2); border-radius:0; padding:.6rem 0; margin-top:.4rem; }
  .datos .fila-r { padding:.3rem 1.2rem; }
  .datos .fila-r span:last-child { text-align:right; word-break:break-word; }
  .pasos { display:flex; gap:.5rem; margin:1.4rem 0 .6rem; }
  .paso { flex:1; text-align:center; font-size:.85rem; color:var(--g3); border-top:3px solid var(--g2); padding-top:.4rem; transition:.3s; }
  .paso.on { color:var(--k); border-color:var(--k); font-weight:500; }
  .giro { width:4.2rem; height:4.2rem; border:4px solid var(--g2); border-top-color:var(--k); border-radius:50%; margin:1rem auto; animation:g 1s linear infinite; }
  @keyframes g { to { transform:rotate(360deg); } }
  .centro { text-align:center; }
</style>
</head>
<body>
<header class="bar"><a class="lk" href="/">← Tienda</a><div class="logo"><svg viewBox="240 254 581 508" fill="currentColor" role="img" aria-label="Marlon Footwear"><polygon points="246,260 426,548 606,260 607,756 570,756 570,388 426,617 283,388 283,756 246,756"/><rect x="606" y="323" width="209" height="37"/><rect x="606" y="521" width="161" height="37"/></svg></div><span></span></header>
<main>
  <section class="tarjeta" id="tarjeta" aria-live="polite">
    <div class="centro"><div class="giro" role="status" aria-label="Cargando"></div><p class="suave">Buscando tu pedido…</p></div>
  </section>
</main>
<script src="meta-pixel.js"></script>
<script src="gracias.js"></script>
</body>
</html>
