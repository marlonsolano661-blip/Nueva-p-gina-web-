<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tu pedido · MF Colombia</title>
<style>
  :root { --tinta:#111; --suave:#6b6b6b; --linea:#e7e2da; --fondo:#faf8f5; --champagne:#b89b6a; --malva:#a8788a; --ok:#2f6b4f; --mal:#a3342f; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--fondo); color:var(--tinta); font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:2.5rem 1.25rem 4rem; }
  .marca { text-align:center; letter-spacing:.32em; font-weight:700; font-size:1.05rem; }
  .marca small { display:block; color:var(--champagne); font-weight:600; letter-spacing:.42em; font-size:.62rem; margin-top:.15rem; }
  .marca i { display:block; width:34px; height:2px; background:var(--champagne); margin:.55rem auto 0; }
  .tarjeta { background:#fff; border:1px solid var(--linea); border-radius:14px; padding:1.6rem 1.4rem; margin-top:1.8rem; }
  h1 { font:600 1.55rem/1.25 Georgia,"Times New Roman",serif; margin:0 0 .4rem; }
  .estado-ok h1 { color:var(--ok); } .estado-mal h1 { color:var(--mal); }
  p { margin:.3rem 0; } .suave { color:var(--suave); font-size:.92rem; }
  .ref { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.85rem; word-break:break-all; }
  hr { border:0; border-top:1px solid var(--linea); margin:1.2rem 0; }
  ul { list-style:none; padding:0; margin:.4rem 0; } li { display:flex; justify-content:space-between; gap:1rem; padding:.3rem 0; }
  .total { display:flex; justify-content:space-between; font-weight:700; padding-top:.5rem; }
  .pasos { display:flex; gap:.4rem; margin:.8rem 0 .2rem; }
  .paso { flex:1; text-align:center; font-size:.78rem; color:var(--suave); border-top:3px solid var(--linea); padding-top:.45rem; }
  .paso.on { color:var(--tinta); border-color:var(--champagne); font-weight:600; }
  .boton { display:inline-block; margin-top:1rem; padding:.8rem 1.4rem; border-radius:999px; border:0; background:var(--tinta); color:#fff; font:inherit; font-weight:600; cursor:pointer; text-decoration:none; }
  .boton.claro { background:transparent; color:var(--tinta); border:1px solid var(--tinta); }
  .centro { text-align:center; }
  .giro { width:26px; height:26px; border:3px solid var(--linea); border-top-color:var(--champagne); border-radius:50%; margin:.6rem auto; animation:g 1s linear infinite; }
  @keyframes g { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .giro { animation:none; } }
</style>
</head>
<body>
<main>
  <div class="marca">MARLON<small>FOOTWEAR</small><i></i></div>
  <section class="tarjeta" id="tarjeta" aria-live="polite">
    <div class="centro"><div class="giro" role="status" aria-label="Cargando"></div><p class="suave">Buscando tu pedido…</p></div>
  </section>
</main>
<script src="gracias.js"></script>
</body>
</html>
