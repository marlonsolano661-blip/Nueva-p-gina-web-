<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='240 254 581 508'%3E%3Cpolygon points='246,260 426,548 606,260 607,756 570,756 570,388 426,617 283,388 283,756 246,756'/%3E%3Crect x='606' y='323' width='209' height='37'/%3E%3Crect x='606' y='521' width='161' height='37'/%3E%3C/svg%3E">
<title>Tu pedido · MF Colombia</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Mismo diseño que la tienda: blanco y negro, verde #1d5c45, Cormorant Garamond + Figtree, botones en píldora */
  :root { --k:#000; --w:#fff; --g1:#f6f6f4; --g2:#e4e4e0; --g3:#6b6b66; --gr:#1d5c45; --gs:#e6f0ea; --bad:#a3342f; --warn:#7a5200; --warn-bg:#faefd6; --ease:cubic-bezier(.2,.8,.2,1); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--w); color:var(--k); font:400 16px/1.6 Figtree,system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  h1, h2, h3 { font-family:'Cormorant Garamond',Georgia,serif; font-weight:700; margin:0; line-height:1.05; letter-spacing:-.01em; }
  p { margin:0; } a { color:inherit; }
  :focus-visible { outline:3px solid var(--k); outline-offset:3px; }
  .bar { position:sticky; top:0; z-index:40; background:#ffffffeb; backdrop-filter:blur(14px); border-bottom:1px solid var(--g2); display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding:.65rem 1.2rem; padding-top:calc(.65rem + env(safe-area-inset-top,0px)); }
  .bar a.lk { justify-self:start; font-weight:600; text-decoration:underline; text-underline-offset:6px; text-decoration-color:var(--g2); }
  .bar a.lk:hover { text-decoration-color:var(--k); }
  .bar .logo { height:2.1rem; color:var(--k); } .bar .logo svg { height:2.1rem; display:block; }
  .btn, .boton { display:inline-flex; justify-content:center; align-items:center; gap:.55rem; min-height:3rem; margin-top:1rem; padding:.9rem 1.8rem; border-radius:999px; border:1.5px solid var(--k); background:var(--k); color:var(--w); font:inherit; font-weight:600; cursor:pointer; text-decoration:none; transition:background .2s,color .2s,transform .2s; }
  .btn:hover, .boton:hover { background:var(--w); color:var(--k); transform:translateY(-1px); } .btn:active, .boton:active { transform:scale(.97); }
  .boton.claro, .btn.o { background:var(--w); color:var(--k); } .boton.claro:hover, .btn.o:hover { background:var(--k); color:var(--w); }
  .btn:disabled, .boton:disabled { opacity:.35; cursor:default; transform:none; }
  input, select { font:inherit; color:inherit; }
  @media (prefers-reduced-motion: reduce) { *, *::after { transition:none !important; animation:none !important; } }
  main { max-width:680px; margin:0 auto; padding:2.2rem 1.2rem 4rem; }
  .tarjeta { text-align:center; }
  h1 { font-size:clamp(2.4rem,6vw,3.2rem); margin:0 0 .8rem; }
  .estado-ok h1::before, .estado-mal h1::before { display:grid; place-items:center; width:4.2rem; height:4.2rem; border-radius:50%; color:var(--w); font:400 1.7rem Figtree,sans-serif; margin:0 auto 1rem; }
  .estado-ok h1::before { content:"✓"; background:var(--gr); } .estado-mal h1::before { content:"✕"; background:var(--bad); }
  .suave { color:var(--g3); } .tarjeta > p { margin:.4rem 0; }
  .ref { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.85rem; word-break:break-all; color:var(--k); }
  hr { border:0; border-top:1px solid var(--g2); margin:1.2rem 0; }
  ul { list-style:none; margin:1.2rem 0 0; padding:1rem 1.2rem .4rem; background:var(--g1); border-radius:1.4rem 1.4rem 0 0; text-align:left; }
  li { display:flex; justify-content:space-between; gap:1rem; padding:.3rem 0; }
  .total { display:flex; justify-content:space-between; font-weight:600; font-size:1.2rem; padding:.8rem 1.2rem 1rem; background:var(--g1); border-radius:0 0 1.4rem 1.4rem; border-top:1px solid var(--g2); text-align:left; }
  ul li { display:flex; justify-content:space-between; gap:1rem; padding:.5rem 0; border-bottom:1px solid var(--g2); }
  ul li:last-child { border-bottom:0; }
  ul li small { display:block; font-size:.82rem; }
  .sec { font-size:.8rem; letter-spacing:.08em; text-transform:uppercase; color:var(--g3); margin:1.6rem 0 .2rem; text-align:left; font-weight:600; }
  .fila-r { display:flex; justify-content:space-between; gap:1rem; padding:.35rem 1.2rem; background:var(--g1); text-align:left; }
  .datos { background:var(--g1); border-radius:1.4rem; padding:.6rem 0; margin-top:.4rem; }
  .datos .fila-r { padding:.3rem 1.2rem; }
  .datos .fila-r span:last-child { text-align:right; word-break:break-word; }
  .pasos { display:flex; gap:.5rem; margin:1.4rem 0 .6rem; }
  .paso { flex:1; text-align:center; font-size:.85rem; color:var(--g3); border-top:3px solid var(--g2); padding-top:.4rem; transition:.3s; }
  .paso.on { color:var(--k); border-color:var(--gr); font-weight:600; }
  .giro { width:4.2rem; height:4.2rem; border:4px solid var(--g2); border-top-color:var(--gr); border-radius:50%; margin:1rem auto; animation:g 1s linear infinite; }
  @keyframes g { to { transform:rotate(360deg); } }
  .centro { text-align:center; }
</style>
</head>
<body>
<header class="bar"><a class="lk" href="/">← Tienda</a><div class="logo"><svg viewBox="240 254 581 508" fill="currentColor" role="img" aria-label="Marlon Footwear"><polygon points="246,260 426,548 606,260 607,756 570,756 570,388 426,617 283,388 283,756 246,756"/><rect x="606" y="323" width="209" height="37"/><rect x="606" y="521" width="161" height="37"/></svg></div><span></span></header>
<main>
  <section class="tarjeta" id="tarjeta" aria-live="polite">
    <div class="centro"><div class="giro" role="status" aria-label="Cargando"></div><p class="suave">Buscando tu pedido…</p></div>
  </section>
</main>
<script src="gracias.js"></script>
</body>
</html>
