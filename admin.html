<script>

 <div class="fg"><div class="f"><label>✏️ Concepto</label><input data-f="concepto" value="${esc(F.concepto)}"></div><div><label>💲 Monto</label><input data-f="monto" type="number" inputmode="numeric" value="${F.monto||''}"></div><div><label>📅 Fecha</label><input data-f="fecha" type="date" value="${esc(F.fecha)}"></div></div>
 <div class="acts"><button class="btn soft" data-a="close">Cancelar</button><button class="btn" data-a="savegasto">🧾 Guardar gasto</button></div>`)}
function cfg(){redraw=cfg;upd=()=>{};open(head('Ajustes ⚙️')+`<div class="fg"><div class="f"><label>🏷️ Nombre de la marca</label><input data-mk="nombre" value="${esc(S.marca.nombre)}"></div><div class="f"><label>💬 WhatsApp de la tienda</label><input data-mk="telefono" type="tel" value="${esc(S.marca.telefono)}"></div><div class="f"><label>🏪 Enlace de la tienda</label><input data-mk="tienda" value="${esc(S.marca.tienda)}"></div><div class="f"><label>🎯 Meta de ventas del mes ($)</label><input data-mk="meta" type="number" inputmode="numeric" value="${S.marca.meta||''}"></div></div>
 <div class="row" style="margin-top:1rem"><button class="btn soft" data-a="theme">${S.marca.tema==='dark'?'☀️ Modo claro':'🌙 Modo oscuro'}</button><button class="btn soft" data-a="pin">${S.marca.pin?'🔒 Cambiar PIN':'🔒 Poner PIN'}</button><button class="btn soft" data-a="bk">💾 Descargar copia</button><button class="btn soft" data-a="rs">📂 Restaurar copia</button><button class="btn bad" data-a="wipe">🗑️ Borrar todo</button></div><p style="color:var(--mut);font-size:.88rem">Tus datos viven en este navegador. Descarga una copia seguido 💪</p>`)}

/* ---- eventos ---- */
box.addEventListener('input',e=>{const t=e.target,d=t.dataset;
 if(d.f){F[d.f]=t.type==='number'?(+t.value||0):t.value;upd()}else if(d.st)F.stock[d.st]=Math.max(0,+t.value||0);else if(d.mk){S.marca[d.mk]=t.value;save();applyBrand()}});
box.addEventListener('change',e=>{if(e.target.dataset.f==='producto'&&F.talla!==undefined){const p=S.products.find(p=>p.name===F.producto);if(p){F.precio=p.price;F.costo=p.cost}F.talla='';redraw()}});
document.addEventListener('click',e=>{const n=e.target.closest('a[href^="#"]');if(n){e.preventDefault();go(n.getAttribute('href').slice(1));return}const a=e.target.closest('[data-a],[data-set],[data-t]');if(!a)return;const d=a.dataset,id=d.id,rw=()=>S.rows.find(r=>r.id==id);
 if(d.set){const[k,v]=d.set.split('|');F[k]=v;if(k==='cat'||k==='origen'||k==='pago'||k==='concepto')redraw();return}
 if(d.t){F.talla=d.t;redraw();return}
 switch(d.a){
 case'go':if(d.pf)pf=d.pf;if(d.df)df=d.df;go(d.go);break;
 case'sale':saleForm(0,d.pay);break;case'editsale':saleForm(id);break;
 case'prod':prodForm(0);break;case'editp':prodForm(id);break;case'gasto':gastoForm();break;case'cfg':cfg();break;
 case'close':close();break;
 case'm':case'p':F.cant=Math.max(1,(+F.cant||1)+(d.a==='p'?1:-1));redraw();break;
 case'vis':F.vis=!F.vis;redraw();break;case'addph':$('#fi').click();break;case'rmph':F.imgs.splice(+d.i,1);redraw();break;
 case'pff':pf=d.v;route();break;case'dff':df=d.v;route();break;case'tab':tab=d.v;route();break;
 case'paid':{const b0=mesV();rw().pago='Pagado';save();route();toast('Pago registrado 💚 Ya está en Finanzas');burst();chk(b0);break}
 case'est':{const r=rw();r.estado=d.v;if(d.v==='Enviado'&&!r.fenvio)r.fenvio=today();save();route();toast(EST[d.v][0]+' '+EST[d.v][1]);break}
 case'delr':{const r=rw(),i=S.rows.indexOf(r);S.rows.splice(i,1);save();route();toast('Fila borrada','Deshacer',()=>{S.rows.splice(i,0,r);save();route()});break}
 case'delg':{const g=S.gastos.find(g=>g.id==id),i=S.gastos.indexOf(g);S.gastos.splice(i,1);save();route();toast('Gasto borrado','Deshacer',()=>{S.gastos.splice(i,0,g);save();route()});break}
 case'savesale':{const p=S.products.find(p=>p.name===F.producto);if(!p)return toast('Elige un producto');if(!F.talla)return toast('Elige la talla 📏');
  const b0=mesV(),falta=!F.id&&avail(p,F.talla)<F.cant;F.cliente=F.cliente.trim();F.tel=F.tel.trim();
  if(F.id)Object.assign(rw()||S.rows.find(r=>r.id==F.id),F);else{F.id=++uid;S.rows.push(F)}
  save();close();route();burst();toast(falta?'Venta guardada ✨ ojo: no alcanzaba el stock':'Venta guardada ✨');chk(b0);break}
 case'savegasto':if(!F.monto)return toast('Escribe el monto');F.id=++uid;F.concepto=F.concepto.trim()||'Gasto';S.gastos.push(F);save();close();route();toast('Gasto guardado 🧾');break;
 case'savep':{const n=(F.name||'').trim();if(!n)return toast('Escribe el nombre del producto ✏️');
  if(S.products.some(p=>p.id!=F.id&&p.name.toLowerCase()===n.toLowerCase()))return toast('Ya existe un producto con ese nombre');
  const stock={};TALLAS.forEach(t=>{if(F.stock[t]>0)stock[t]=F.stock[t]});
  const p={id:F.id||++uid,name:n,cat:F.cat,color:(F.color||'').trim(),desc:(F.desc||'').trim(),price:F.price,cost:F.cost,stock,imgs:F.imgs,img:F.imgs[0]||'',vis:F.vis};
  if(F.id){if(F._old!==n)S.rows.forEach(r=>{if(r.producto===F._old)r.producto=n});S.products[S.products.findIndex(x=>x.id==F.id)]=p}else S.products.push(p);
  save();close();if(cur!=='inventario')go('inventario');else route();burst();toast('Producto guardado ✨');break}
 case'delp':{const i=S.products.findIndex(x=>x.id==F.id),p=S.products[i];S.products.splice(i,1);save();close();route();toast('Producto borrado','Deshacer',()=>{S.products.splice(i,0,p);save();route()});break}
 case'csv':{const c=v=>'"'+String(v).replace(/"/g,'""')+'"',V=tab==='v';const h=V?['Fecha','Cliente','Producto','Talla','Cantidad','Precio','Total','Ganancia','Origen']:['Fecha','Concepto','Monto'];
  const rs=V?vis().map(r=>[r.fecha,r.cliente,r.producto,r.talla,r.cant,r.precio,tot(r),gan(r),r.origen]):S.gastos.filter(inMes).map(g=>[g.fecha,g.concepto,g.monto]);
  dl((V?'ventas-':'gastos-')+today()+'.csv','\ufeff'+[h,...rs].map(r=>r.map(c).join(',')).join('\n'),'text/csv;charset=utf-8');break}
 case'stk':{const pr=S.products.find(x=>x.id==id);pr.stock[d.z]=Math.max(sold(pr,d.z),(+pr.stock[d.z]||0)+(+d.d));save();route();break}
 case'pin':{const v=prompt('PIN nuevo de 4 a 6 números (vacío = quitar el PIN)');if(v===null)break;if(v==='')S.marca.pin='';else if(/^\d{4,6}$/.test(v))S.marca.pin=hp(v);else{toast('Usa de 4 a 6 números');break}save();cfg();toast(S.marca.pin?'🔒 PIN activado':'PIN quitado');break}
 case'theme':S.marca.tema=S.marca.tema==='dark'?'light':'dark';save();applyBrand();cfg();break;
 case'bk':dl('marlon-admin-copia-'+today()+'.json',JSON.stringify(S),'application/json');break;
 case'rs':$('#rsf').click();break;
 case'wipe':if(confirm('¿Borrar TODOS los datos de este dispositivo?')&&confirm('Seguro seguro. No se puede deshacer.')){S=fix({products:[],rows:[],gastos:[],marca:S.marca});save();close();route();toast('Todo borrado')}break}
});
/* edición en hoja y envíos */
$('#app').addEventListener('input',e=>{const t=e.target,tr=t.closest('tr');
 if(t.dataset.dk){const r=S.rows.find(r=>r.id==t.closest('.cd').dataset.id);r[t.dataset.dk]=t.value;save();return}
 if(t.id==='q'){q=t.value.trim().toLowerCase();const p=$('#tb');route();const n=$('#q');n.focus();n.setSelectionRange(99,99);return}
 if(t.id==='mes'){mes=t.value;route();return}
 const k=t.dataset.k;if(!k||!tr)return;const gasto=!!t.closest('#tg'),r=(gasto?S.gastos:S.rows).find(x=>x.id==tr.dataset.id);r[k]=t.type==='number'?(+t.value||0):t.value;
 if(!gasto){if(k==='producto'){const p=S.products.find(p=>p.name===t.value);if(p){r.precio=p.price;r.costo=p.cost;tr.querySelector('[data-k=precio]').value=p.price}}
  tr.querySelector('.t').textContent=fmt(tot(r));tr.querySelector('.g').textContent=fmt(gan(r))}
 save();finTot()});
const dl=(n,t,ty)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:ty}));a.download=n;a.click()};
$('#rsf').onchange=e=>{const f=e.target.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{try{const d=JSON.parse(fr.result);if(!d.rows||!d.products)throw 0;if(!confirm('Esto reemplaza los datos actuales. ¿Continuar?'))return;S=fix(d);save();applyBrand();close();route();toast('Copia restaurada 💪')}catch(x){toast('Ese archivo no es una copia válida')}};fr.readAsText(f);e.target.value=''};
function readImg(file){return new Promise((ok,no)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.78))};im.onerror=no;im.src=fr.result};fr.onerror=no;fr.readAsDataURL(file)})}
$('#fi').onchange=async e=>{const fs=[...e.target.files];e.target.value='';if(!F.imgs)return;for(const f of fs){if(F.imgs.length>=5)break;try{F.imgs.push(await readImg(f))}catch(x){toast('No pude leer esa imagen')}}redraw()};
function applyBrand(){$('#tienda').href=S.marca.tienda||'index.html';document.title='Admin · '+S.marca.nombre;document.documentElement.dataset.theme=S.marca.tema==='dark'?'dark':'light'}
$('#sp').innerHTML=Array.from({length:9},(_,i)=>`<i style="left:${(i*11+5)%96}%;animation-delay:${-i*2}s;font-size:${.8+i%3*.4}rem">${['✨','⚡','⭐','🚀'][i%4]}</i>`).join('');
try{const h0=location.hash.slice(1);if(V[h0])cur=h0}catch(e){}applyBrand();route();lockInit();
try{localStorage.removeItem('marlon_pin')}catch(e){}
</script></body></html>
