document.addEventListener('click',e=>{const b=e.target.closest('[data-sd]');if(b)sdGo(+b.dataset.sd)});
document.addEventListener('pointermove',e=>{const r=e.target.closest&&e.target.closest('#sd');if(!r)return;const b=r.getBoundingClientRect(),x=(e.clientX-b.left)/b.width-.5,y=(e.clientY-b.top)/b.height-.5,t=$('#sds');t.style.setProperty('--ry',(x*16)+'deg');t.style.setProperty('--rx',(-y*12)+'deg')});
document.addEventListener('pointerleave',()=>{const t=$('#sds');if(t){t.style.setProperty('--ry','0deg');t.style.setProperty('--rx','0deg')}},true);
function pgFx(){const a=$('#app');a.classList.remove('pgin');void a.offsetWidth;a.classList.add('pgin')}
addEventListener('scroll',()=>{const h=document.documentElement,m=h.scrollHeight-innerHeight;$('#spg').style.transform='scaleX('+(m>0?Math.min(1,scrollY/m):0)+')'},{passive:true});
document.addEventListener('click',e=>{const b=e.target.closest('[data-n="gi"]');if(b){gi=+b.dataset.i;draw()}});
const IO='IntersectionObserver'in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');IO.unobserve(e.target)}}),{threshold:.12}):null;
function reveal(){if(!IO)return;document.querySelectorAll('#app .pc,#app .lc,#app .vals>div,#app .band>div,#app .mf>*:not(.seal),#app .sd').forEach((el,i)=>{el.classList.add('rv');el.style.transitionDelay=(i%3)*70+'ms';IO.observe(el)})}
function draw(){$('#app').innerHTML=PG[pg]();$('#cnt').textContent=CART.reduce((s,l)=>s+l.q,0);renderBag();reveal();heroInit()}
function nav(p,a,m){if(p==='cart'){openBag();return}closeBag();pg=p;arg=a||null;if(m)mode=m;if(p==='prod'){gi=0;selT='';selC=0;guideT='';guideOpen=false}try{history.pushState({p:pg,a:arg,m:mode},'')}catch(e){}draw();pgFx();scrollTo(0,0)}
addEventListener('popstate',e=>{if(e.state){pg=e.state.p;arg=e.state.a;mode=e.state.m||mode;draw()}});
document.addEventListener('click',e=>{const a=e.target.closest('[data-n]');if(!a)return;const d=a.dataset;
 switch(d.n){
 case'go':nav(d.p,null,d.m);break;case'prod':nav('prod',d.id);break;
 case'gt':guideOpen=!guideOpen;draw();break;
 case'color':selC=+d.i;draw();break;
 case'cm':{guideT=d.t;const p=catalog().find(x=>String(x.id)===String(arg));if(p&&p.tallas.includes(d.t)){selT=d.t;toast('Talla '+d.t+' seleccionada')}draw();break}
 case'talla':selT=d.t;draw();break;
 case'add':if(add(d.id)){draw();bagBump();toast('Agregado a tu bolsa','Ver bolsa',()=>nav('cart'))}break;
 case'buy':if(add(d.id))nav('cart');break;
 case'q':{const l=CART[+d.i];l.q=Math.max(1,l.q+(+d.d));bumpI=+d.i;saveCart();draw();break}
 case'bagclose':closeBag();break;
 case'shopen':openSheet();break;case'shclose':closeSheet();break;case'shstep':shStep=d.s;renderSheet();break;case'sendlook':sendLook();break;
 case'rm':CART.splice(+d.i,1);saveCart();draw();break;
 case'topay':{const c=FRM;if(!c.nombre.trim()||!c.tel.trim()||!c.ciudad.trim()||!c.dir.trim()){toast('Completa tus datos de entrega');break}nav('pay');break}
 case'wacart':if(CART.length)window.open(waLink(cartMsg()),'_blank');break;case'submit':submit();break}});
document.addEventListener('input',e=>{const k=e.target.dataset.f;if(k)FRM[k]=e.target.value;const l=e.target.dataset.l;if(l)LK[l]=e.target.type==='checkbox'?e.target.checked:e.target.value});
document.addEventListener('input',e=>{if(e.target.id==='q'){Q=e.target.value;$('#gr').innerHTML=grid()}});document.addEventListener('change',e=>{if(e.target.id==='so'){SO=e.target.value;$('#gr').innerHTML=grid()}});
addEventListener('storage',e=>{if(e.key!=='marlon_admin_v1')return;try{ADM=JSON.parse(e.newValue)}catch(x){ADM=null}real=!!(ADM&&ADM.products&&ADM.products.length);draw()});
try{history.replaceState({p:'home',a:null,m:mode},'')}catch(e){}
draw();
</script><script src="pago-online.js"></script>
</body></html>
