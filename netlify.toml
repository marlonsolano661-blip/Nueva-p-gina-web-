# Solo se usa si publicas en Netlify. En Vercel este archivo se ignora.
[build]
  publish = "."
  # Ahorro de créditos: Netlify solo construye main y las vistas previas de un pull request. Los push sueltos a otras ramas no se construyen.
  # La vista previa usa las llaves de prueba de Wompi y su propia SITE_URL (variables "Deploy Previews" en Netlify).
  # Correos: la llave de Resend (RESEND_API_KEY) es de la cuenta nueva con mfcol.com verificado.
  ignore = "if [ \"$BRANCH\" = \"main\" ] || [ \"$CONTEXT\" = \"deploy-preview\" ]; then exit 1; else exit 0; fi"

# Escaneo de secretos de Netlify: DESACTIVADO por decisión del dueño de la tienda (el build fallaba por coincidencias
# que no se pudieron ubicar). Para volver a activarlo: borrar la línea SECRETS_SCAN_ENABLED y cambiar ADMIN_TOKEN en Netlify.
# Mientras esté desactivado, NINGUNA clave privada debe escribirse en archivos del repo (es público).
[build.environment]
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "META_PIXEL_ID,MAIL_FROM,OWNER_EMAIL"
  SECRETS_SCAN_OMIT_PATHS = "test/**,*.test.js,*.e2e.js,lib/*.test.js"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # compartir.js lee index.html para ponerle la vista previa de cada producto
  included_files = ["index.html"]

# Enlace directo a un producto (/?producto=...): la tienda con la foto, el nombre y el precio de ese producto al compartir el enlace.
# Solo se activa cuando el enlace trae ?producto=; la portada normal (/) sigue siendo el archivo estático.
[[redirects]]
  from = "/"
  to = "/.netlify/functions/compartir?id=:id"
  status = 200
  query = {producto = ":id"}

# El frontend llama a /api/..., Netlify lo envía a la función correspondiente
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# Los archivos de pruebas no son parte de la tienda: que no se puedan abrir desde internet.
[[redirects]]
  from = "/test/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/frontend.e2e.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/seguimiento-admin-sql.test.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/sugerir-color.test.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/lib/descuentos.test.js"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/panel-pedidos.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/gracias.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/admin-tienda.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
