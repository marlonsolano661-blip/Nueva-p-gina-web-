# Solo se usa si publicas en Netlify. En Vercel este archivo se ignora.
[build]
  publish = "."
  # Ahorro de créditos: Netlify solo construye main y las vistas previas de un pull request. Los push sueltos a otras ramas no se construyen.
  # La vista previa usa las llaves de prueba de Wompi y su propia SITE_URL (variables "Deploy Previews" en Netlify).
  # Correos: la llave de Resend (RESEND_API_KEY) es de la cuenta nueva con mfcol.com verificado.
  ignore = "if [ \"$BRANCH\" = \"main\" ] || [ \"$CONTEXT\" = \"deploy-preview\" ]; then exit 1; else exit 0; fi"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # compartir.js lee index.html para ponerle la vista previa de cada producto
  included_files = ["index.html"]

# Enlace directo a un producto (/?producto=...): la tienda con la foto, el nombre y el precio de ese producto al compartir el enlace.
# Solo se activa cuando el enlace trae ?producto=; la portada normal (/) sigue siendo el archivo estático.
[[redirects]]
  from = "/"
  to = "/.netlify/functions/compartir?id=:id"
  status = 200
  query = {producto = ":id"}

# El frontend llama a /api/..., Netlify lo envía a la función correspondiente
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/panel-pedidos.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/gracias.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/admin-tienda.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
