name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar archivos obligatorios
        run: |
          test -f index.html
          test -f admin-tienda.html && test -f panel.css && test -f panel-menu.js && test -f admin-lookbook.js && test -f admin-perchero.js
      - name: Buscar tokens expuestos
        run: |
          if grep -rIE "ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}" --exclude-dir=.git --exclude-dir=.github .; then
            echo "Posible token de GitHub en el código"
            exit 1
          fi
